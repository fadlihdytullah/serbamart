[project]
name = "serbamart"
version = "0.1.0"
description = "Data for Serbamart, a fictional minimarket chain used in the suikodev Data Engineer path."
requires-python = ">=3.14,<3.15"
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.1",
    "duckdb==2.0.0",
    "fastapi==0.162.2",
    "pandas==3.1.1",
    "requests==2.34.2",
    "streamlit==1.67.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx==0.28.1"]
