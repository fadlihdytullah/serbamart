x-airflow: &airflow
  image: serbamart-airflow
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    SERBAMART_API_URL: http://api:8000
    SERBAMART_API_KEY: serbamart-dev-key
    DBT_USE_COLORS: "false"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: serbamart-local-secret
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    PYTHONWARNINGS: ignore::PendingDeprecationWarning
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - .:/opt/serbamart
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  api:
    <<: *airflow
    entrypoint: ["/home/airflow/serbamart/bin/python", "systems/api.py"]
    working_dir: /opt/serbamart
    environment:
      HOST: 0.0.0.0
      SERBAMART_API_KEY: serbamart-dev-key
    ports:
      - "8000:8000"
    depends_on: []

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  dashboard:
    <<: *airflow
    entrypoint: ["/home/airflow/serbamart/bin/streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--browser.serverAddress=localhost"]
    working_dir: /opt/serbamart
    ports:
      - "8501:8501"
    depends_on: []

  airflow-init:
    <<: *airflow
    command: db migrate

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow
    command: triggerer
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
