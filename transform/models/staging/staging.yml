models:
  - name: stg_branches
    columns:
      - name: branch_id
        data_tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: sku
        data_tests: [unique, not_null]
  - name: stg_pos_sales
    columns:
      - name: transaction_id
        data_tests: [not_null]
      - name: branch_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_branches')
                field: branch_id
      - name: sku
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: sku
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: [cash, qris, debit, ewallet, unknown]
  - name: stg_online_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [paid, cancelled]
