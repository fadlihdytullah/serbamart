models:
  - name: mart_daily_sales
    description: Revenue per business day and channel (store or online), for reports and dashboards.
    config:
      meta:
        owner: data
    columns:
      - name: sales_date
        description: Business day in Jakarta time (WIB).
      - name: channel
        description: store for cashier sales, online for paid web shop orders.
      - name: sales
        description: Store transactions or online orders.
      - name: revenue
        description: Sum of quantity times unit price, in rupiah.
  - name: mart_branch_daily_sales
    description: One row per branch per business day with its rank and the change against the 7 days before.
    config:
      meta:
        owner: data
    columns:
      - name: avg_7_days
        description: Average daily revenue over the 7 calendar days before, empty on the first day.
      - name: rank
        description: Rank by revenue among branches on that day, 1 is the highest.
  - name: mart_product_daily_sales
    description: Units and revenue per product, business day and channel.
    config:
      meta:
        owner: merchandising
  - name: dim_branch
    description: One row per branch, plus the web shop as branch WEB, so every sale has a place.
    config:
      meta:
        owner: operations
    columns:
      - name: branch_id
        data_tests: [unique, not_null]
  - name: dim_date
    description: One row per calendar day from the first to the last sale, with the labels reports group by.
    config:
      meta:
        owner: data
    columns:
      - name: date_day
        data_tests: [unique, not_null]
  - name: fct_sales
    description: One row per product per sale, from the cashiers and the web shop; the center of the star.
    config:
      meta:
        owner: data
      contract:
        enforced: true
    columns:
      - name: sale_id
        data_type: varchar
        constraints:
          - type: not_null
      - name: channel
        data_type: varchar
        constraints:
          - type: not_null
      - name: date_day
        data_type: date
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: branch_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_branch')
                field: branch_id
      - name: product_key
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: sku
        data_type: varchar
      - name: qty
        data_type: integer
      - name: unit_price
        data_type: integer
      - name: revenue
        data_type: integer
  - name: dim_product
    description: One row per product per price, from the catalog snapshot (slowly changing dimension type 2).
    config:
      meta:
        owner: merchandising
    columns:
      - name: product_key
        description: One price version of one product.
        data_tests: [unique, not_null]
      - name: valid_from
        description: First business day this price applies.
      - name: valid_to
        description: First day it no longer applies; 9999-12-31 for the current price.
